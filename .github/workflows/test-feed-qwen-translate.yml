name: Test Deterministic Sources + Qwen Translation

on:
  push:
    branches:
      - experiment/local-ai-qwen
    paths:
      - ".github/workflows/test-feed-qwen-translate.yml"
      - "scripts/test_feed_qwen_translate.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  feed-qwen-translate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install feed dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "feedparser==6.0.12" "beautifulsoup4==4.14.2"

      - name: Restore Ollama model cache
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-qwen3-1.7b-v1

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama --version

      - name: Start Ollama
        run: |
          nohup ollama serve >/tmp/ollama.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/ollama.log
          exit 1

      - name: Ensure Qwen3 1.7B
        run: |
          ollama pull qwen3:1.7b
          ollama list

      - name: Build four cards
        id: build
        continue-on-error: true
        run: |
          python scripts/test_feed_qwen_translate.py

      - name: Show report
        if: always()
        run: |
          if [ -f test-output-qwen-translate/report.txt ]; then
            cat test-output-qwen-translate/report.txt
          else
            echo "No report produced."
          fi

      - name: Upload translation experiment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rss-qwen-translation-test
          path: test-output-qwen-translate/
          if-no-files-found: warn
          retention-days: 7

      - name: Fail if pipeline incomplete
        if: steps.build.outcome != 'success'
        run: exit 1
