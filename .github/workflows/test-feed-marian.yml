name: Test Filtered RSS + Marian Translation

on:
  push:
    branches:
      - experiment/local-ai-qwen
    paths:
      - ".github/workflows/test-feed-marian.yml"
      - "scripts/test_feed_marian.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  feed-marian-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"

    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install translation and feed dependencies
        run: |
          pip install "transformers<5" sentencepiece sacremoses "feedparser==6.0.12" "beautifulsoup4==4.14.2"

      - name: Fetch, filter, translate, build cards
        id: build
        continue-on-error: true
        run: |
          python scripts/test_feed_marian.py

      - name: Show report
        if: always()
        run: |
          if [ -f test-output-marian/report.txt ]; then
            cat test-output-marian/report.txt
          else
            echo "No report produced."
          fi

      - name: Upload Marian experiment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rss-marian-translation-test
          path: test-output-marian/
          if-no-files-found: warn
          retention-days: 7

      - name: Fail if pipeline incomplete
        if: steps.build.outcome != 'success'
        run: exit 1
